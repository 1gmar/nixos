backend = "glx";
detect-client-leader = true;
detect-client-opacity = true;
detect-rounded-corners = true;
detect-transient = true;
dithered-present = false;
fading = false;
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.6;
unredir-if-possible = false;
use-damage = true;
use-ewmh-active-win = true;
vsync = true;
xrender-sync-fence = true;
rules = (
  {
    match = "!(focused || group_focused) && !(wmwin || override_redirect) && window_type != 'dock'";
    dim = 0.1;
  },
  {
    match = "window_type ~= '^(combo|dropdown_menu|popup_menu|menu|utility)$'";
    shadow = false;
  },
  {
    match = "window_type ~= '^(desktop|dialog|normal)$' && window_type !~= '^(combo|dropdown_menu|popup_menu|tooltip|utility)$'";
    animations = (
      {
        triggers = ["open", "show"];
        preset = "appear";
        scale = 0.8;
        duration = 0.2;
      },
      {
        triggers = ["close"];
        preset = "disappear";
        scale = 0.8;
        duration = 0.2;
      },
      {
        triggers = ["hide"];
        preset = "disappear";
        scale = 1;
        duration = 0.2;
      },
      {
        triggers = ["position"];
        preset = "geometry-change";
        duration = 0.2;
      }
    );
  },
  {
    match = "window_type = 'popup_menu'";
    animations = (
      {
        triggers = ["open", "show"];
        preset = "appear";
        scale = 1;
        duration = 0.2;
      },
      {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 1;
        duration = 0.1;
      }
    );
  },
  {
    match = "window_type ~= '^(combo|dropdown_menu)$'";
    animations = (
      {
        triggers = ["open", "show"];
        preset = "slide-in";
        direction = "up";
        duration = 0.2;
      },
      {
        triggers = ["close", "hide"];
        preset = "slide-out";
        direction = "up";
        duration = 0.1;
      }
    );
  },
  {
    match = "window_type = 'notification'";
    corner-radius = 10;
    shadow = true;
    animations = (
      {
        triggers = ["open", "show"];
        preset = "slide-in";
        direction = "right";
        duration = 0.2;
      },
      {
        triggers = ["close", "hide"];
        preset = "slide-out";
        direction = "right";
        duration = 0.2;
      }
    );
  },
  {
    match = "window_type = 'tooltip'";
    opacity = 1;
    shadow = false;
  },
  {
    match = "class_g ~?= '^(firefox|thunar|thunderbird)$' && window_type = 'tooltip'";
    invert-color = true;
  },
  {
    match = "class_i = 'Telegram'";
    shadow = false;
  },
  {
    match = "class_g ?= 'thunar' && window_type != 'tooltip'";
    shadow = true;
  }
)
